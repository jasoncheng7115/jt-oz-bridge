<!doctype html>
<html lang="{{ locale }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>jt-oz-bridge</title><link rel="stylesheet" href="/static/app.css"><script src="/static/preferences.js" defer></script><script src="/static/diagnostics.js" defer></script><script src="/static/theme.js" defer></script></head>
<body><a class="skip" href="#content">{{ t('console.skip') }}</a><main id="content" tabindex="-1"><h1>{{ t('admin.title') }}</h1><p>jt-oz-bridge {{ version }}</p><p>{{ t('console.managed') if managed else t('admin.setup') }}</p><p>{{ t('admin.not_certified') }}</p><nav class="overview-nav" aria-label="{{ t('console.navigation') }}"><a href="/admin/runtime-modes">{{ t('console.runtime_modes') }}</a>{% for section in sections %}<a href="/admin/{{ section }}">{{ t('console.' + section) }}</a>{% endfor %}</nav><label>{{ t('console.theme') }}<select id="theme"><option value="system">{{ t('console.system') }}</option><option value="light">{{ t('console.light') }}</option><option value="dark">{{ t('console.dark') }}</option></select></label><label>{{ t('admin.language') }}<select id="locale"><option value="en" {% if locale == 'en' %}selected{% endif %}>English</option><option value="zh-TW" {% if locale == 'zh-TW' %}selected{% endif %}>繁體中文（台灣）</option></select></label><button id="save">{{ t('admin.save') }}</button><button id="logout">{{ t('admin.logout') }}</button><button id="diagnostics" data-busy="{{ t('diagnostics.busy') }}" data-ready="{{ t('diagnostics.ready') }}" data-error="{{ t('diagnostics.error') }}">{{ t('diagnostics.download') }}</button><p id="result" role="status" aria-live="polite"></p></main></body></html>
