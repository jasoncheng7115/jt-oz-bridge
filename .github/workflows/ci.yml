name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep the checkout free of byte code, caches and the venv: the public gate scans it.
  PYTHONDONTWRITEBYTECODE: "1"
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/../venv
  UV_PYTHON: "3.13"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install the locked environment
        run: uv sync --locked --python 3.13

      - name: Public content gate
        # The one published commit author is a repository variable, not text in a file.
        env:
          JTOZ_PUBLIC_IDENTITY: ${{ vars.JTOZ_PUBLIC_IDENTITY }}
        run: uv run --no-sync python -m scripts.public_gate .

      - name: Lint
        run: uv run --no-sync ruff check --no-cache src tests scripts

      - name: Format
        run: uv run --no-sync ruff format --check --no-cache src tests scripts

      - name: Types
        run: uv run --no-sync mypy --cache-dir "$RUNNER_TEMP/mypy-cache" src

      - name: Tests
        run: uv run --no-sync pytest -q -p no:cacheprovider --junitxml="$RUNNER_TEMP/junit.xml" tests

      - name: Name the failed tests
        # Annotations are public, while the job log needs admin rights: list each failure there.
        if: failure()
        run: |
          python3 - "$RUNNER_TEMP/junit.xml" <<'EOF'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path(sys.argv[1])
          if not report.is_file():
              sys.exit(0)
          shown = 0
          for case in ET.parse(report).iter("testcase"):
              for problem in [*case.iter("failure"), *case.iter("error")]:
                  name = f"{case.get('classname')}.{case.get('name')}"
                  text = (problem.get("message") or problem.text or "")[:600]
                  text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  name = name.replace("%", "%25").replace(":", "%3A").replace(",", "%2C")
                  print(f"::error title={name}::{text}")
                  shown += 1
              if shown >= 50:
                  break
          EOF
