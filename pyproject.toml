[project]
name = "jt-oz-bridge"
version = "0.1.1"
description = "A self-hosted bridge connecting AI agents with messaging, starting with OpenCode and Zulip"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "httpx==0.28.1",
  "httpcore==1.0.9",
  "certifi>=2026.10.19",
  "httpx-sse>=0.4,<1",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "alembic>=1.15,<2",
  "aiosqlite>=0.21,<1",
  "asyncpg>=0.30,<1",
  "jinja2>=3.1.6,<4",
  "markdown-it-py>=3,<5",
  "argon2-cffi>=23,<26",
  "jsonschema>=4.23,<5",
  "cryptography>=46,<51",
]

[project.scripts]
jt-oz-bridge = "jt_oz_bridge.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jt_oz_bridge"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "respx>=0.22,<1",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "pip-audit>=2.8,<3",
    "types-jsonschema>=4.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

